#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "personal_linktree"
name = "Personal Linktree"
description.en = "Self-hosted link tree with analytics, custom email, and rich features"
description.tr = "Analytics, özel email ve zengin özelliklere sahip kendi sunucunuzda link tree"

version = "1.1~ynh1"

maintainers = ["rraeyz"]

[upstream]
license = "MIT"
code = "https://github.com/rraeyz/personal-linktree_ynh"
admindoc = "https://github.com/rraeyz/personal-linktree_ynh/blob/main/README.md"

[integration]
yunohost = ">= 11.3"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "500M"
ram.build = "1G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"
    help.en = "Choose a domain for your linktree"
    help.tr = "Linktree'niz için bir domain seçin"

    [install.path]
    type = "path"
    default = "/"
    help.en = "URL path for the application. Installing on a sub-path (e.g. /linktree) is not supported yet, keep it as /"
    help.tr = "Uygulama için URL yolu. Alt yola (ör. /linktree) kurulum henüz desteklenmiyor, / olarak bırakın"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Who can access the public linktree page"
    help.tr = "Herkese açık linktree sayfasına kimler erişebilir"

[resources]
    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    dir = "/opt/yunohost/__APP__"

    [resources.data_dir]
    dir = "/home/yunohost.app/__APP__"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 3000

    [resources.apt]
    packages = []

    # __YNH_DEBIAN_VERSION__ YunoHost tarafından sunucunun Debian sürümüyle (bullseye/bookworm) değiştirilir (YunoHost >= 11.3)
    extras.docker.repo = "deb https://download.docker.com/linux/debian __YNH_DEBIAN_VERSION__ stable"
    extras.docker.key = "https://download.docker.com/linux/debian/gpg"
    extras.docker.packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-compose-plugin"]
